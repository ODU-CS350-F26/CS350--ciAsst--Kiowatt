plugins {
    id 'java'
    id 'application'
    id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.toVersion(17)
    targetCompatibility = JavaVersion.toVersion(17)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true

    testLogging {
        events "passed", "skipped", "failed"
    }

    reports {
        junitXml.required = true
        html.required = true
    }
}

application {
    mainClass = 'edu.odu.cs.MostCommonWords'
}


javadoc {
    destinationDir = file("$buildDir/reports/javadoc")
}

tasks.register('reports', Copy) {
    dependsOn 'build', 'javadoc'
    from 'src/main/html'
    into "$buildDir/reports"
}



gitPublishCopy.dependsOn 'reports'


gitPublish {
    repoUri = 'https://github.com/ODU-CS350-F26/CS350--ciAsst--Kiowatt.git'
    branch = 'gh-pages'

    contents {
        from "$buildDir/reports"
    }
}



tasks.register('deployReports') {
    group = 'Reporting'
    description = 'Build and publish project reports'
    dependsOn 'gitPublishPush'
}
